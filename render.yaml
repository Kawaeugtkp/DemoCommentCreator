# =====================================================================
#  Render Blueprint
#  - Dockerfile からビルドして Web サービスとして常駐（free プラン）
#  - GitHub 連携：master への push で自動デプロイ
#  - ヘルスチェックは /healthz（200を返す軽量ルート）
#
#  ■ 秘密情報は値をここに書かない（sync: false）。
#    Render ダッシュボードの Environment で各値を入力する。
#  ■ PORT は Render が自動注入し、Nitro(process.env.PORT) が拾う。
#    HOST=0.0.0.0 は Dockerfile 側で設定済み。
# =====================================================================
services:
  - type: web
    name: demo-comment-creator
    runtime: docker
    plan: free
    region: singapore           # 日本から最も近い Render リージョン
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true            # push で自動デプロイ
    envVars:
      # --- 合言葉ログイン ---
      - key: LOGIN_TEXT
        sync: false
      # --- Firebase ---
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # --- アカウント共通パスワード ---
      - key: ACCOUNT_PASSWORD
        sync: false
      # --- 130アカウントのメールアドレス ---
